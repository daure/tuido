[package]
name = "tuitodo"
version = "0.4.0"
edition = "2024"
default-run = "tuido"
description = "Keyboard-first task manager with optional MCP access"
repository = "https://github.com/daure/tuido"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["task-management", "tui", "terminal", "productivity", "mcp"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
    "migrations/**",
    "tests/**",
]

[lib]
name = "tuido"
path = "src/lib.rs"

[[bin]]
name = "tuido"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "0.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tuicore = "0.6.0"
ratatui = "0.30"
regex = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "signal", "net", "macros"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset", "serde"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
